<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="50%" style="stop-color:#764ba2"/>
      <stop offset="100%" style="stop-color:#f093fb"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#ffaa00"/>
      <stop offset="100%" style="stop-color:#ff8c00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="20" height="20">
      <circle cx="10" cy="10" r="1" fill="#ffffff" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Card Background -->
  <rect width="600" height="800" rx="24" fill="url(#cardBg)"/>
  <rect width="600" height="800" rx="24" fill="url(#dots)"/>
  
  <!-- Top accent bar -->
  <rect y="0" width="600" height="8" rx="4" fill="url(#accent)"/>
  
  <!-- Header -->
  <text x="300" y="70" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">TipStream Pro</text>
  <text x="300" y="100" font-family="Arial, sans-serif" font-size="14" fill="#888" text-anchor="middle">OFFICIAL TIP RECEIPT</text>
  
  <!-- Divider -->
  <line x1="50" y1="130" x2="550" y2="130" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>
  
  <!-- Main coin/logo -->
  <circle cx="300" cy="260" r="100" fill="none" stroke="url(#gold)" stroke-width="6" filter="url(#glow)"/>
  <circle cx="300" cy="260" r="80" fill="url(#gold)" opacity="0.2"/>
  <text x="300" y="285" font-family="Georgia, serif" font-size="80" font-weight="bold" fill="url(#gold)" text-anchor="middle" filter="url(#glow)">Ξ</text>
  
  <!-- Amount section -->
  <rect x="50" y="400" width="500" height="100" rx="12" fill="#ffffff" opacity="0.05"/>
  <text x="300" y="440" font-family="Arial, sans-serif" font-size="16" fill="#888" text-anchor="middle">TIP AMOUNT</text>
  <text x="300" y="480" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">0.001 ETH</text>
  
  <!-- Details -->
  <rect x="50" y="520" width="500" height="160" rx="12" fill="#ffffff" opacity="0.03"/>
  
  <text x="80" y="560" font-family="Arial, sans-serif" font-size="14" fill="#666">Network</text>
  <text x="520" y="560" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="end">Base Chain</text>
  
  <line x1="80" y1="580" x2="520" y2="580" stroke="#333" stroke-width="1"/>
  
  <text x="80" y="610" font-family="Arial, sans-serif" font-size="14" fill="#666">Platform Fee</text>
  <text x="520" y="610" font-family="Arial, sans-serif" font-size="14" fill="#4ade80" text-anchor="end">0.0001 ETH</text>
  
  <line x1="80" y1="630" x2="520" y2="630" stroke="#333" stroke-width="1"/>
  
  <text x="80" y="660" font-family="Arial, sans-serif" font-size="14" fill="#666">Status</text>
  <text x="520" y="660" font-family="Arial, sans-serif" font-size="14" fill="#4ade80" text-anchor="end">✓ Confirmed</text>
  
  <!-- Footer -->
  <line x1="50" y1="710" x2="550" y2="710" stroke="#333" stroke-width="1"/>
  
  <text x="300" y="750" font-family="monospace" font-size="12" fill="#666" text-anchor="middle">Verified on Base • Powered by TipStream Pro</text>
  <text x="300" y="775" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">tipstream.pro</text>
  
  <!-- Bottom accent -->
  <rect y="792" width="600" height="8" rx="4" fill="url(#accent)"/>
</svg>
